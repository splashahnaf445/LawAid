<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | LawAid</title><link rel="stylesheet" href="../assets/css/admin-login.css"></head><body><main class="admin-login-screen"><div class="admin-login-wrap"><div class="admin-brand-mark">⚖</div><h1>LawAid</h1><p class="admin-subtitle">CHAMBER ADMINISTRATION</p><form class="admin-login-card" id="adminLoginForm"><h2>Welcome back</h2><p>Please enter your credentials to access LawAid.</p><label for="adminEmail">EMAIL ADDRESS</label><input id="adminEmail" type="email" placeholder="admin@lawaid.gov.bd" required><label for="adminPassword">PASSWORD <a href="#" id="forgotPassword">Forgot Password?</a></label><input id="adminPassword" type="password" placeholder="Enter your password" required><label class="remember"><input type="checkbox" checked> <span>Remember this device</span></label><button type="submit">Log In <span>→</span></button><p class="login-message" id="loginMessage" aria-live="polite"></p></form><a class="admin-back" href="../role-access.html">← Back to role selection</a></div></main><script>document.getElementById('adminLoginForm').addEventListener('submit',function(e){e.preventDefault();window.location.href='dashboard.html';});document.getElementById('forgotPassword').addEventListener('click',function(e){e.preventDefault();document.getElementById('loginMessage').textContent='Please contact your system administrator to reset your password.';});</script></body></html>
