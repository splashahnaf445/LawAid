              schema:
                $ref: '#/components/schemas/PaymentDispute'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/audit-logs/:
    get:
      tags: [Admin]
      summary: Audit log
      description: |
        Critical actions (FR-37), newest first.

        **Roles:** admin.
      operationId: listAuditLogs
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-54
      x-roles: [admin]
      parameters:
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: entity_type
          in: query
          schema:
            type: string
          example: appointment
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/ai-messages/:
    get:
      tags: [Admin, AI Assistant]
      summary: Chatbot answers flagged for review
      description: |
        `ai_messages` with `flagged_for_review = true` (SYS-48).

        **Roles:** admin.
      operationId: listFlaggedAiMessages
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-48
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of AI messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiMessagePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/conversations/:
    get:
      tags: [AI Assistant]
      summary: My chatbot conversations
      description: |
        **Roles:** client, lawyer.
      operationId: listAiConversations
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-44
      x-roles: [client, lawyer]
      responses:
        '200':
          description: Conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiConversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [AI Assistant]
      summary: Start a chatbot conversation
      description: |
        Works without login for public visitors (FR-26): the response then contains a
        `session_token` to send as `X-AI-Session` on later calls.

        **Roles:** public, client, lawyer.
      operationId: createAiConversation
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-47
      x-roles: [public, client, lawyer]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConversationCreate'
      responses:
        '201':
          description: Conversation started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConversation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidTokenOnPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/conversations/{ai_conversation_id}/messages/:
    get:
      tags: [AI Assistant]
      summary: Messages of a chatbot conversation
      description: |
        Oldest first. Logged-in users must own the conversation; anonymous visitors send
        their `X-AI-Session` header.

        **Roles:** public (with session header), client, lawyer.
      operationId: listAiMessages
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-44
      x-roles: [public, client, lawyer]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AiConversationId'
        - $ref: '#/components/parameters/AiSessionHeader'
      responses:
        '200':
          description: Messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiMessage'
        '401':
          $ref: '#/components/responses/InvalidTokenOnPublic'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [AI Assistant]
      summary: Ask the chatbot
      description: |
        Answers in the user's language (Bangla or English, SYS-46) with a legal disclaimer.
        Out-of-scope questions set `is_out_of_scope` and `suggest_booking` so the UI can
        offer to book a lawyer (FR-29, SYS-45).

        **Roles:** public (with session header), client, lawyer.
      operationId: askAi
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-44
      x-roles: [public, client, lawyer]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AiConversationId'
        - $ref: '#/components/parameters/AiSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiMessageCreate'
      responses:
        '201':
          description: The user's message and the assistant's reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReply'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidTokenOnPublic'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/recommendations/:
    post:
      tags: [AI Assistant, Lawyers]
      summary: AI lawyer recommendation
      description: |
        Ranks approved lawyers for the described issue, with a reason per match (SYS-26).

        **Roles:** client.
      operationId: createAiRecommendation
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-26
      x-roles: [client]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRecommendationCreate'
      responses:
        '201':
          description: Ranked recommendations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRecommendation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST /api/auth/token/`, sent as
        `Authorization: Bearer <access>` (note the space after `Bearer`).
        Lifetime 60 minutes; refresh with `POST /api/auth/token/refresh/`.

  parameters:
    LawyerId:
      name: lawyer_id
      in: path
      required: true
      description: The lawyer's user id (`lawyer_profiles.user_id` = `users.id`).
      schema:
        type: string
        format: uuid
      example: a0000000-0000-7000-8000-000000000016
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Id of a `lawyer_verification_documents` row.
      schema:
        type: string
        format: uuid
      example: d1000000-0000-7000-8000-000000000161
    Page:
      name: page
      in: query
      description: 1-based page number (DRF PageNumberPagination, 10 items per page).
      schema:
        type: integer
        minimum: 1
        default: 1
    SlotId:
      name: slot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: b0000000-0000-7000-8000-000000000001
    AppointmentId:
      name: appointment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: c0000000-0000-7000-8000-000000000005
    SosId:
      name: sos_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: c1000000-0000-7000-8000-000000000001
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: f0000000-0000-7000-8000-000000000001
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: e0000000-0000-7000-8000-000000000001
    HearingId:
      name: hearing_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: e1000000-0000-7000-8000-000000000002
    CaseDocumentId:
      name: case_document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: e2000000-0000-7000-8000-000000000001
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 90000000-0000-7000-8000-000000000001
    QrToken:
      name: qr_token
      in: path
      required: true
      description: Hex token encoded in the receipt's QR code.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 4f9a2c7e1b8d3a6f0c5e9b2d7a4f1c8e
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 91000000-0000-7000-8000-000000000001
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: a0000000-0000-7000-8000-000000000027
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 92000000-0000-7000-8000-000000000001
    DisputeId:
      name: dispute_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 93000000-0000-7000-8000-000000000001
    AiConversationId:
      name: ai_conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: f1000000-0000-7000-8000-000000000002
    AiSessionHeader:
      name: X-AI-Session
      in: header
      description: Anonymous visitors only - the `session_token` returned when the conversation was created.
      schema:
        type: string
      example: anon-7f3c91b2

  responses:
    ValidationError:
      description: Invalid input. Keys are field names (or `non_field_errors`); values are lists of messages.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrors'
          example:
            non_field_errors: [Invalid input.]
    Unauthorized:
      description: No token, or the token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          examples:
            missing:
              summary: No Authorization header
              value:
                detail: Authentication credentials were not provided.
            invalid:
              summary: Expired or invalid access token
              value:
                detail: Given token not valid for any token type
                code: token_not_valid
    InvalidTokenOnPublic:
      description: Only happens on a public endpoint if an invalid or expired token is sent anyway; retry without the header or refresh the token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Given token not valid for any token type
            code: token_not_valid
    Forbidden:
      description: Logged in, but the role (or ownership) does not allow this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: You do not have permission to perform this action.
    AdminOnly:
      description: Logged in but not an admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Access restricted to LawAid compliance administrators only.
    NotFound:
      description: No resource at this path or id. Ids that are not valid UUIDs fail URL matching and get Django's 404 page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Not found.
    Conflict:
      description: The resource is not in a state that allows this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: This action is not allowed in the current status.
    DocumentFile:
      description: The decrypted file bytes, with the original MIME type.
      headers:
        Content-Disposition:
          description: '`inline; filename="..."` for view, `attachment; filename="..."` for download.'
          schema:
            type: string
          example: inline; filename="nid-front-back.pdf"
        Cache-Control:
          description: Always `no-store, no-cache, must-revalidate, private`.
          schema:
            type: string
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
    DocumentsAdminOnly:
      description: Not an admin (NFR-4).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: 'Unauthorized: Verification identification documents are strictly confidential and accessible only to authorized platform administrators (SRS NFR-4).'
    DocumentNotFound:
      description: No document with this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Document record not found.
    DecryptionFailed:
      description: The stored file could not be decrypted (wrong key or corrupted file).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            error: 'Failed to decrypt document: InvalidToken'

