  schemas:
    # ---------------- errors ----------------
    ErrorDetail:
      type: object
      description: DRF default error body (401, 403, 404 and some 409).
      required: [detail]
      properties:
        detail:
          type: string
        code:
          type: string
          description: Machine-readable code when DRF or SimpleJWT provides one, e.g. `token_not_valid`.
        messages:
          type: array
          description: Extra SimpleJWT detail for invalid tokens.
          items:
            type: object
            additionalProperties: true
    ErrorMessage:
      type: object
      description: Custom error body used by a few implemented views.
      required: [error]
      properties:
        error:
          type: string
    ValidationErrors:
      type: object
      description: DRF validation errors. Each key is a field name or `non_field_errors`.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        email: [Enter a valid email address.]
    StatusMessage:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
        message:
          type: string
      example:
        status: success
        message: Done.

    # ---------------- enums (values from db/schema.sql) ----------------
    UserRole:
      type: string
      enum: [client, lawyer, admin]
    AccountStatus:
      type: string
      enum: [invited, pending_verification, active, suspended, deactivated]
    LanguageCode:
      type: string
      enum: [bn, en]
    GenderType:
      type: string
      enum: [male, female, other, undisclosed]
    VerificationStatus:
      type: string
      enum: [pending, approved, rejected]
    VerificationDocType:
      type: string
      enum: [nid, bar_certificate]
    ConsultationFormat:
      type: string
      enum: [video, audio, chat, in_person]
    AppointmentStatus:
      type: string
      description: Mirrors the SRS state diagram (section 7.7) as encoded in `appointment_status`.
      enum:
        - slot_reserved
        - payment_pending
        - awaiting_lawyer
        - rescheduled
        - confirmed
        - in_progress
        - completed
        - disputed
        - payment_released
        - reviewed
        - closed
        - cancelled
        - declined
        - expired
        - refunded
    PaymentMethod:
      type: string
      enum: [sslcommerz, bkash, nagad]
    PaymentStatus:
      type: string
      enum: [initiated, pending, succeeded, failed, refunded]
    EscrowStatus:
      type: string
      enum: [none, held, released, refunded, disputed]
    DisputeStatus:
      type: string
      enum: [open, under_review, resolved_for_lawyer, resolved_for_client, withdrawn]
    CaseStatus:
      type: string
      enum: [open, in_progress, pending_review, disposed, closed]
    CaseUrgency:
      type: string
      enum: [regular, urgent, vacation_bench]
    HearingStatus:
      type: string
      enum: [scheduled, held, adjourned, cancelled]
    DocumentStatus:
      type: string
      enum: [pending_review, verified, action_required, rejected]
    MessageType:
      type: string
      enum: [text, file, system]
    AiRole:
      type: string
      enum: [user, assistant, system]
    SosStatus:
      type: string
      enum: [requested, matched, accepted, cancelled, expired, completed]
    ReportStatus:
      type: string
      enum: [submitted, under_review, action_taken, dismissed]
    NotifChannel:
      type: string
      enum: [in_app, push, sms, whatsapp, email]
    NotifStatus:
      type: string
      enum: [queued, sent, failed, read]
    DeletionStatus:
      type: string
      enum: [requested, processing, completed, rejected]

    # ---------------- shared building blocks ----------------
    Money:
      type: string
      format: decimal
      description: Amount in BDT as a decimal string (DRF default), e.g. `"1500.00"`.
      pattern: '^\d+(\.\d{1,2})?$'
      example: '1500.00'
    BdPhone:
      type: string
      description: Bangladeshi mobile number in `+8801XXXXXXXXX` form.
      pattern: '^\+8801[3-9][0-9]{8}$'
      example: '+8801713000022'
    PageMeta:
      type: object
      description: DRF PageNumberPagination envelope used by planned list endpoints.
      required: [count, next, previous]
      properties:
        count:
          type: integer
          example: 23
        next:
          type: string
          format: uri
          nullable: true
          example: http://localhost:8000/api/appointments/?page=3
        previous:
          type: string
          format: uri
          nullable: true
          example: http://localhost:8000/api/appointments/?page=1

    # ---------------- system ----------------
    ApiRoot:
      type: object
      properties:
        system:
          type: string
        version:
          type: string
        modules:
          type: object
          additionalProperties:
            type: string
        status:
          type: string

    # ---------------- auth ----------------
    TokenObtainRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenPair:
      type: object
      required: [refresh, access]
      properties:
        refresh:
          type: string
          description: Refresh token, valid 7 days.
        access:
          type: string
          description: Access token, valid 60 minutes.
    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    TokenRefreshResponse:
      type: object
      required: [access]
      properties:
        access:
          type: string
        refresh:
          type: string
          description: New refresh token (rotation is on).
    ClientRegisterRequest:
      type: object
      description: Fields of `users` and `client_profiles`. Only the first four are required.
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        phone:
          $ref: '#/components/schemas/BdPhone'
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        preferred_language:
          allOf:
            - $ref: '#/components/schemas/LanguageCode'
          default: bn
        gender:
          allOf:
            - $ref: '#/components/schemas/GenderType'
