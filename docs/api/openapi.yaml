openapi: 3.0.3
info:
  title: LawAid REST API
  version: 0.1.0
  description: |
    REST contract for LawAid (CSE 3422, UIU, team SysVision): a verified lawyer consultation
    and case management platform for Bangladesh. Backend: Django + Django REST Framework +
    SimpleJWT on PostgreSQL (SYS-78). Frontend: React (Vite).

    **How to read this file** (full conventions in `docs/api/README.md`):

    - `x-status: implemented` means the endpoint exists in code. It is documented exactly as
      the code behaves today, including field names that differ from the database schema.
      `x-branch` names the branch, and `x-merged-to-main` says whether it is on `main` yet.
    - `x-status: planned` means nobody has written it yet. The shape is a proposal in the
      same style, and its field names follow `db/schema.sql`.
    - `x-owner` is the team member responsible; `x-jira` is the Jira key; `x-roles` lists
      who may call it (`public` means no token needed).
    - All example data is fake and follows the style of `db/seed.sql`.

    Source of truth for names: `db/schema.sql` and `db/seed.sql` on `main` (SYS-14).
  contact:
    name: Team SysVision (SYS-16 owner Tahsin A Parthib)
    url: https://github.com/splashahnaf445/LawAid
  license:
    name: Coursework - all rights reserved
    url: https://github.com/splashahnaf445/LawAid
servers:
  - url: http://localhost:8000
    description: Local Django development server (python manage.py runserver)
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service metadata.
  - name: Auth
    description: Registration, login, token refresh, logout, current user and password recovery (FR-1, FR-4, FR-5).
  - name: Lawyer Verification
    description: NID and Bar Council certificate upload, admin review queue, approve or reject with reason (FR-2, FR-3, NFR-4).
  - name: Lawyers
    description: Public verified-lawyer directory, profiles with the Verified badge, and the lawyer's own profile (FR-3, FR-6, FR-8).
  - name: Reference Data
    description: Courts and practice areas used by forms and filters.
  - name: Availability
    description: Lawyer availability slots (planned).
  - name: Appointments
    description: Booking, consultation sessions and the appointment state machine (planned).
  - name: SOS
    description: 24/7 emergency lawyer finder (planned).
  - name: Chat
    description: Client-lawyer conversations and messages (planned).
  - name: Cases
    description: Case management, hearings, timeline and case documents (planned).
  - name: Payments
    description: Sandbox payments, escrow, QR-verifiable receipts and disputes (planned).
  - name: Notifications
    description: In-app notification inbox (planned).
  - name: Reviews and Reports
    description: Ratings, reviews and confidential misconduct reports (planned).
  - name: Admin
    description: Admin dashboard, account control, reports, disputes and audit (planned).
  - name: AI Assistant
    description: Bilingual legal chatbot and AI lawyer recommendation (planned).
x-tagGroups:
  - name: This week - registration, login and lawyer verification
    tags:
      - System
      - Auth
      - Lawyer Verification
      - Lawyers
  - name: Planned modules
    tags:
      - Reference Data
      - Availability
      - Appointments
      - SOS
      - Chat
      - Cases
      - Payments
      - Notifications
      - Reviews and Reports
      - Admin
      - AI Assistant

paths:
  # ===================================================================
  # PRIORITY 1 - registration, login and lawyer verification
  # ===================================================================
  /:
    get:
      tags: [System]
      summary: API root and module index
      description: Plain Django view (not DRF). Returns service name, version and module prefixes.
      operationId: getApiRoot
      x-status: implemented
      x-owner: Ahnaf Shahriar
      x-jira: SYS-21
      x-branch: lawyer_docupload_verify_badge
      x-merged-to-main: false
      x-roles: [public]
      security: []
      responses:
        '200':
          description: Service metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
              example:
                system: LawAid Backend API
                version: 1.0.0
                modules:
                  auth: /api/auth/
                  verification: /api/verification/
                  lawyers: /api/lawyers/
                status: online
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/register/client/:
    post:
      tags: [Auth]
      summary: Register a client account
      description: |
        Creates a `users` row with `role = client` and a matching `client_profiles` row (FR-1).
        Same response style as lawyer registration. Does not log the user in; the frontend
        calls `POST /api/auth/token/` afterwards.

        **Roles:** public.
        **Validation:** email unique (case-insensitive), phone optional but unique and in
        `+8801XXXXXXXXX` form (`01XXXXXXXXX` is normalised), password at least 8 characters.
      operationId: registerClient
      x-status: planned
      x-owner: Usama Abdullah
      x-jira: SYS-18
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegisterRequest'
            example:
              full_name: Sharmin Akter
              email: sharmin.akter@example.com
              phone: '+8801713000031'
              password: LawAid@123
              preferred_language: bn
              gender: female
              date_of_birth: '1996-07-12'
              division: Dhaka
              district: Dhaka
              address: Mohammadpur, Dhaka
      responses:
        '201':
          description: Client account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegisterResponse'
              example:
                status: success
                message: Client registration successful. Please log in to continue.
                user_id: a0000000-0000-7000-8000-000000000031
                email: sharmin.akter@example.com
                role: client
        '400':
          description: Validation failed (missing field, bad phone, weak password or duplicate email/phone).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                email: [A user with this email address already exists.]
                password: [Ensure this field has at least 8 characters.]
        '401':
          $ref: '#/components/responses/InvalidTokenOnPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/register/lawyer/:
    post:
      tags: [Auth, Lawyer Verification]
      summary: Register a lawyer with NID and Bar Council certificate
      description: |
        Creates the user (`role = lawyer`), the lawyer profile with
        `verification_status = pending`, and two encrypted verification documents
        (`nid` and `bar_certificate`) in one transaction (FR-1, FR-2, NFR-4).
        The lawyer stays hidden from search until an admin approves (FR-3).

        **Roles:** public.
        **Files:** `nid_document` and `bar_certificate_document`, each PDF, PNG, JPG or JPEG,
        at most 15 MB. Files are encrypted at rest and only admins can read them back.
        **Notes:** `bar_council_no` is trimmed and upper-cased and must be unique. Password
        minimum is 6 characters here (the planned client endpoint uses 8, see README).
        The user's account `status` is set to `active`; verification state lives in
        `verification_status`.
      operationId: registerLawyer
      x-status: implemented
      x-owner: Ahnaf Shahriar
      x-jira: SYS-21
      x-branch: lawyer_docupload_verify_badge
      x-merged-to-main: false
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LawyerRegisterRequest'
            encoding:
              nid_document:
                contentType: application/pdf, image/png, image/jpeg
              bar_certificate_document:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        '201':
          description: Registration accepted; documents encrypted and queued for admin review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LawyerRegisterResponse'
              example:
                status: success
                message: Lawyer registration submitted successfully. Your NID and Bar Council certificate have been securely encrypted and placed in the admin verification queue.
                lawyer_id: a0000000-0000-7000-8000-000000000016
                email: farhan.chowdhury@example.com
                bar_council_no: DH-22871
                verification_status: pending
                is_verified: false
                badge: null
                notice: Your profile will remain hidden from client search results until verification is approved by a platform administrator (SRS FR-3).
        '400':
          description: Validation failed. Keys are field names; values are lists of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                email: [A user with this email address already exists.]
                bar_council_no: [A lawyer with this Bar Council Sanad Number is already registered.]
                nid_document: [Unsupported file type (.docx). Allowed formats are PDF, PNG, JPG, and JPEG.]
        '401':
          $ref: '#/components/responses/InvalidTokenOnPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/token/:
    post:
      tags: [Auth]
      summary: Log in (obtain JWT access and refresh tokens)
      description: |
        SimpleJWT `TokenObtainPairView` with email as the username field (FR-4).
        Access token lives 60 minutes, refresh token 7 days (NFR-3).

        **Roles:** public.
        **Token claims:** `token_type`, `exp`, `iat`, `jti`, `user_id` (UUID string).
        There is **no `role` claim**; call `GET /api/auth/me/` after login to get the role.
        **Frontend difference:** the current React client calls `POST /api/auth/login/` and
        expects `{access, user}`; see README "Frontend differences".
      operationId: obtainToken
      x-status: implemented
      x-owner: Ahnaf Shahriar
      x-jira: SYS-19
      x-branch: lawyer_docupload_verify_badge
      x-merged-to-main: false
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainRequest'
            example:
              email: ayesha.rahman@example.com
              password: LawAid@123
      responses:
        '200':
          description: Credentials accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.FAKE-REFRESH-PAYLOAD.FAKE-SIGNATURE
                access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.FAKE-ACCESS-PAYLOAD.FAKE-SIGNATURE
        '400':
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                password: [This field is required.]
        '401':
          description: Wrong email or password, or the account is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: No active account found with the given credentials
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/token/refresh/:
    post:
      tags: [Auth]
      summary: Refresh the access token
      description: |
        SimpleJWT `TokenRefreshView`. `ROTATE_REFRESH_TOKENS` is on, so the response also
        contains a **new refresh token**; store it and discard the old one.

        **Roles:** public (the refresh token is the credential).
        **Frontend difference:** the current React client calls `POST /api/auth/refresh/`
        with no body (cookie based); see README.
      operationId: refreshToken
      x-status: implemented
      x-owner: Ahnaf Shahriar
      x-jira: SYS-19
      x-branch: lawyer_docupload_verify_badge
      x-merged-to-main: false
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            example:
              refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.FAKE-REFRESH-PAYLOAD.FAKE-SIGNATURE
      responses:
        '200':
          description: New access token (and rotated refresh token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
              example:
                access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.FAKE-NEW-ACCESS.FAKE-SIGNATURE
                refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.FAKE-NEW-REFRESH.FAKE-SIGNATURE
        '400':
          description: The `refresh` field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                refresh: [This field is required.]
        '401':
          description: Refresh token is invalid or expired; the user must log in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                detail: Token is invalid or expired
                code: token_not_valid
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/logout/:
    post:
      tags: [Auth]
      summary: Log out (revoke the refresh token)
      description: |
        Blacklists the given refresh token so it can no longer be used. The access token
        simply expires (max 60 minutes). Needs `rest_framework_simplejwt.token_blacklist`
        in `INSTALLED_APPS` (schema table `refresh_tokens` also supports revocation).

        **Roles:** client, lawyer, admin.
        **Frontend difference:** the React client posts to this path with no body.
      operationId: logout
      x-status: planned
      x-owner: Saker Munshi
      x-jira: SYS-19
      x-roles: [client, lawyer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            example:
              refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.FAKE-REFRESH-PAYLOAD.FAKE-SIGNATURE
      responses:
        '204':
          description: Logged out. No body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/me/:
    get:
      tags: [Auth]
      summary: Current user
      description: |
        Returns the logged-in user (fields from `users`) plus the lawyer's
        `verification_status`. The frontend uses this after login or refresh to learn the
        `role` and route to the right dashboard.

        **Roles:** client, lawyer, admin.
      operationId: getMe
      x-status: planned
      x-owner: Saker Munshi
      x-jira: SYS-19
      x-roles: [client, lawyer, admin]
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: a0000000-0000-7000-8000-000000000016
                role: lawyer
                full_name: Farhan Chowdhury
                email: farhan.chowdhury@example.com
                phone: '+8801712000016'
                preferred_language: bn
                status: active
                avatar_url: null
                two_factor_enabled: false
                email_verified_at: '2026-11-19T10:15:00+06:00'
                phone_verified_at: null
                last_login_at: '2026-11-20T09:02:00+06:00'
                created_at: '2026-11-19T10:15:00+06:00'
                verification_status: pending
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/password/forgot/:
    post:
      tags: [Auth]
      summary: Request a password reset link or code
      description: |
        Sends a single-use reset token by email or SMS (FR-5). Send exactly one of `email`
        or `phone`. Always answers 200 with the same message, whether or not the account
        exists, so attackers cannot discover registered emails. The token is stored hashed
        in `password_reset_tokens` and expires after 30 minutes.

        **Roles:** public.
      operationId: forgotPassword
      x-status: planned
      x-owner: Mashruba Aktar
      x-jira: SYS-20
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
            examples:
              byEmail:
                summary: Reset by email
                value:
                  email: ayesha.rahman@example.com
              byPhone:
                summary: Reset by SMS
                value:
                  phone: '+8801713000022'
      responses:
        '200':
          description: Request accepted (same answer for unknown accounts).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
              example:
                status: success
                message: If an account matches, a password reset link has been sent.
        '400':
          description: Neither or both of `email` and `phone` were sent, or the format is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                non_field_errors: [Provide either email or phone.]
        '401':
          $ref: '#/components/responses/InvalidTokenOnPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/password/reset/:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: |
        Consumes the token from the email link or SMS (sets `used_at`), sets the new
        password and revokes the user's refresh tokens so other sessions are logged out.

        **Roles:** public.
      operationId: resetPassword
      x-status: planned
      x-owner: Mashruba Aktar
      x-jira: SYS-20
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: 7Qx2kP9mVt4sLb8w
              new_password: NewLawAid@456
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
              example:
                status: success
                message: Your password has been reset. Please log in with the new password.
        '400':
          description: Token invalid, expired or already used, or the new password is too weak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                token: [This reset link is invalid or has expired.]
        '401':
          $ref: '#/components/responses/InvalidTokenOnPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/lawyers/:
    get:
      tags: [Lawyers]
      summary: Public verified-lawyer directory
      description: |
        Lists lawyers with `verification_status = approved` only, each with the
        `is_verified` flag and the `verification_badge` object (FR-3). Pending and rejected
        lawyers never appear. Not paginated: returns every match plus `count`.

        **Roles:** public. An admin may pass `all=true` to include unverified lawyers;
        `verified_only` in the response then becomes `false`.
        **Planned filters** (SYS-24, SYS-25): practice area, court, fee range, format,
        `sos_available` and minimum rating, as query parameters on this same endpoint.
      operationId: searchLawyers
      x-status: implemented
      x-owner: Ahnaf Shahriar
      x-jira: SYS-22
      x-branch: lawyer_docupload_verify_badge
      x-merged-to-main: false
      x-roles: [public]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive match on name, headline, specialization, Bar Council no. or district.
          schema:
            type: string
          example: family
        - name: district
          in: query
          description: Exact district (case-insensitive).
          schema:
            type: string
          example: Dhaka
        - name: specialization
          in: query
          description: Substring match on `specialization`.
          schema:
            type: string
          example: Family
        - name: ordering
          in: query
          description: Sort order. Unknown values are ignored.
          schema:
            type: string
            enum: [-avg_rating, consultation_fee, -consultation_fee, -years_experience]
            default: -avg_rating
        - name: all
          in: query
          description: Admins only. `true` includes pending and rejected lawyers.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      responses:
        '200':
          description: Matching verified lawyers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LawyerSearchResponse'
              example:
                count: 1
                verified_only: true
                results:
                  - lawyer_id: a0000000-0000-7000-8000-000000000012
                    full_name: Nusrat Adil
                    email: nusrat.adil@lawaid.com.bd
                    phone: '+8801712000012'
                    avatar_url: /assets/img/avatars/lawyer-nusrat-adil.jpg
                    honorific: Adv.
                    headline: Advocate, Dhaka District & Sessions Court
                    bar_council_no: DH-10492
                    bar_association: Dhaka Bar Association
                    district: Dhaka
                    specialization: Family & Custody, Inheritance & Probate, Cyber Law
                    consultation_fee: '800.00'
                    years_experience: 11
                    avg_rating: '4.70'
                    review_count: 3
                    verification_status: approved
                    is_verified: true
                    verification_badge:
                      is_active: true
                      title: Bar Council Verified Advocate
                      badge_name: LawAid Verified Seal
                      sanad_number: DH-10492
                      bar_association: Dhaka Bar Association
                      verified_at: '2026-05-24T05:00:00+00:00'
                      verified_by_name: Rahid Karim
                      trust_seal: Verified Credentials & Bangladesh Bar Council Sanad Authenticated
        '401':
          $ref: '#/components/responses/InvalidTokenOnPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/lawyers/me/:
    get:
      tags: [Lawyers, Lawyer Verification]
      summary: My lawyer profile and verification status
      description: |
        The logged-in lawyer's full profile. This is the **"my verification status"**
        endpoint: read `verification_status`, `rejection_reason` (set when rejected),
        `verification_badge` (only when approved) and `documents` (metadata of the uploaded
        NID and certificate).

        **Roles:** lawyer.
      operationId: getMyLawyerProfile
      x-status: implemented
      x-owner: Ahnaf Shahriar
      x-jira: SYS-22
      x-branch: lawyer_docupload_verify_badge
      x-merged-to-main: false
      x-roles: [lawyer]
      responses:
        '200':
          description: The lawyer's profile (pending example).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LawyerProfileDetail'
              examples:
                pending:
                  $ref: '#/components/examples/PendingLawyerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The user is not a lawyer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                error: Only lawyers have a lawyer profile.
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Lawyers]
      summary: Update my lawyer profile
      description: |
        Partial update of the lawyer's own profile (SYS-23). Field names follow
        `lawyer_profiles`. `bar_council_no` and `verification_status` are read-only here.

        **Roles:** lawyer.
      operationId: updateMyLawyerProfile
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-23
      x-roles: [lawyer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LawyerProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LawyerProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/lawyers/me/verification-documents/:
    post:
      tags: [Lawyer Verification]
      summary: Re-upload NID and Bar Council certificate after rejection
      description: |
        Lets a **rejected** lawyer submit new documents. Replaces the previous documents,
        sets `verification_status` back to `pending`, clears `rejection_reason` and puts
        the lawyer back in the admin queue. Same field names, formats and 15 MB limit as
        registration.

        **Roles:** lawyer.
      operationId: resubmitVerificationDocuments
      x-status: planned
      x-owner: Ahnaf Shahriar
      x-jira: SYS-21
      x-roles: [lawyer]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationDocumentsUpload'
            encoding:
              nid_document:
                contentType: application/pdf, image/png, image/jpeg
              bar_certificate_document:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        '201':
          description: Documents accepted; status is pending again.
          content:
