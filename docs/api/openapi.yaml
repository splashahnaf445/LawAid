      required: [appointment_id, rating]
      properties:
        appointment_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
      example:
        appointment_id: c0000000-0000-7000-8000-000000000003
        rating: 5
        comment: Clear advice on inheritance shares and next steps.
    ReviewPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Review'
    ConfidentialReportCreate:
      type: object
      description: Give `lawyer_id`, or `lawyer_name_text` if the lawyer is not on LawAid.
      required: [violation_type, statement]
      properties:
        is_anonymous:
          type: boolean
          default: false
        lawyer_id:
          type: string
          format: uuid
        lawyer_name_text:
          type: string
        appointment_id:
          type: string
          format: uuid
        violation_type:
          type: string
        statement:
          type: string
      example:
        is_anonymous: true
        lawyer_id: a0000000-0000-7000-8000-000000000013
        violation_type: Chamber Overcharging / Escrow Bypass
        statement: I was asked to pay an extra amount in cash outside the platform for the same session.
    ConfidentialReportUpload:
      allOf:
        - $ref: '#/components/schemas/ConfidentialReportCreate'
        - type: object
          properties:
            attachments:
              type: array
              items:
                type: string
                format: binary
    ConfidentialReportReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ReportStatus'
        created_at:
          type: string
          format: date-time
      example:
        id: 92000000-0000-7000-8000-000000000001
        status: submitted
        created_at: '2026-11-20T19:30:00+06:00'
    ConfidentialReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporter_id:
          type: string
          format: uuid
          nullable: true
        is_anonymous:
          type: boolean
        lawyer_id:
          type: string
          format: uuid
          nullable: true
        lawyer_name_text:
          type: string
          nullable: true
        appointment_id:
          type: string
          format: uuid
          nullable: true
        violation_type:
          type: string
        statement:
          type: string
        status:
          $ref: '#/components/schemas/ReportStatus'
        admin_notes:
          type: string
          nullable: true
        handled_by:
          type: string
          format: uuid
          nullable: true
        attachments:
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
              url:
                type: string
                description: Short-lived admin-only link.
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
      example:
        id: 92000000-0000-7000-8000-000000000001
        reporter_id: null
        is_anonymous: true
        lawyer_id: a0000000-0000-7000-8000-000000000013
        lawyer_name_text: Adv. Mukarram Hossain
        appointment_id: null
        violation_type: Chamber Overcharging / Escrow Bypass
        statement: I was asked to pay an extra amount in cash outside the platform for the same session.
        status: under_review
        admin_notes: Contacting the lawyer for a written response.
        handled_by: a0000000-0000-7000-8000-000000000002
        attachments: []
        created_at: '2026-11-18T19:30:00+06:00'
        resolved_at: null
    ConfidentialReportUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReportStatus'
        admin_notes:
          type: string
      example:
        status: action_taken
        admin_notes: Lawyer warned; account flagged for 90-day monitoring.
    ConfidentialReportPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/ConfidentialReport'

