    AiConversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
          description: '`null` for anonymous visitors.'
        session_token:
          type: string
          nullable: true
          description: Returned only to anonymous visitors; send it as `X-AI-Session`.
        language:
          $ref: '#/components/schemas/LanguageCode'
        title:
          type: string
          nullable: true
        module:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      example:
        id: f1000000-0000-7000-8000-000000000002
        user_id: null
        session_token: anon-7f3c91b2
        language: en
        title: What are my rights if arrested?
        module: General Legal Questions
        created_at: '2026-11-19T20:00:00+06:00'
    AiConversationCreate:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/LanguageCode'
        module:
          type: string
      example:
        language: bn
        module: Civil & Property
    AiMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AiRole'
        content:
          type: string
        language:
          type: string
          nullable: true
          enum: [bn, en, null]
        model:
          type: string
          nullable: true
        is_out_of_scope:
          type: boolean
        disclaimer_shown:
          type: boolean
        citations:
          type: array
          nullable: true
          items:
            type: object
            properties:
              act:
                type: string
              section:
                type: string
        flagged_for_review:
          type: boolean
        created_at:
          type: string
          format: date-time
      example:
        id: f3000000-0000-7000-8000-000000000004
        conversation_id: f1000000-0000-7000-8000-000000000002
        role: assistant
        content: In general, an arrested person has the right to be informed of the grounds of arrest, to consult a lawyer of their choice, and to be produced before a magistrate within 24 hours. This is general information, not legal advice.
        language: en
        model: placeholder-llm
        is_out_of_scope: false
        disclaimer_shown: true
        citations:
          - act: Constitution of Bangladesh
            section: Article 33
        flagged_for_review: false
        created_at: '2026-11-19T20:00:05+06:00'
    AiMessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
      example:
        content: What are my basic rights if I am arrested by the police?
    AiReply:
      type: object
      properties:
        user_message:
          $ref: '#/components/schemas/AiMessage'
        assistant_message:
          $ref: '#/components/schemas/AiMessage'
        suggest_booking:
          type: boolean
          description: True when the question needs a lawyer; the UI shows a "Book a lawyer" button.
      example:
        user_message:
          id: f3000000-0000-7000-8000-000000000003
          conversation_id: f1000000-0000-7000-8000-000000000002
          role: user
          content: What are my basic rights if I am arrested by the police?
          language: en
          model: null
          is_out_of_scope: false
          disclaimer_shown: false
          citations: null
          flagged_for_review: false
          created_at: '2026-11-19T20:00:00+06:00'
        assistant_message:
          id: f3000000-0000-7000-8000-000000000004
          conversation_id: f1000000-0000-7000-8000-000000000002
          role: assistant
          content: In general, an arrested person has the right to be informed of the grounds of arrest, to consult a lawyer of their choice, and to be produced before a magistrate within 24 hours. This is general information, not legal advice.
          language: en
          model: placeholder-llm
          is_out_of_scope: false
          disclaimer_shown: true
          citations:
            - act: Constitution of Bangladesh
              section: Article 33
          flagged_for_review: false
          created_at: '2026-11-19T20:00:05+06:00'
        suggest_booking: false
    AiMessagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/AiMessage'
    AiRecommendationCreate:
      type: object
      required: [issue_text]
      properties:
        issue_text:
          type: string
        filters:
          type: object
          additionalProperties: true
          description: Optional, e.g. `district`, `max_fee`, `format`.
      example:
        issue_text: My landlord wants to evict me without any notice.
        filters:
          district: Dhaka
          max_fee: 1500
    AiRecommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        issue_text:
          type: string
        filters:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              lawyer_id:
                type: string
                format: uuid
              rank:
                type: integer
                minimum: 1
              score:
                type: number
                minimum: 0
                maximum: 1
              reason:
                type: string
                nullable: true
      example:
        id: f4000000-0000-7000-8000-000000000001
        client_id: a0000000-0000-7000-8000-000000000022
        issue_text: My landlord wants to evict me without any notice.
        filters:
          district: Dhaka
          max_fee: 1500
        created_at: '2026-11-20T11:00:00+06:00'
        items:
          - lawyer_id: a0000000-0000-7000-8000-000000000011
            rank: 1
            score: 0.92
            reason: Civil & property specialist in Dhaka, 18 years of experience.
          - lawyer_id: a0000000-0000-7000-8000-000000000012
            rank: 2
            score: 0.71
            reason: Handles tenancy-related family property disputes.
