      description: |
        Reserves the slot and creates the appointment with status `slot_reserved` and a
        `hold_expires_at` (unpaid holds expire). Free sessions (`fee_amount = 0`) go
        straight to `awaiting_lawyer`. Only approved lawyers can be booked (database
        trigger, FR-3).

        **State machine** (SYS-30, SRS 7.7): `slot_reserved` -> `payment_pending` ->
        `awaiting_lawyer` -> `confirmed` | `declined` | `rescheduled`;
        `rescheduled` -> `confirmed` | `cancelled`; `confirmed` -> `in_progress` ->
        `completed` -> `payment_released` (client confirms) -> `reviewed` -> `closed`;
        `completed` -> `disputed` -> `payment_released` | `refunded`;
        unpaid holds -> `expired`; `cancelled` and `declined` paid bookings -> `refunded`.

        **Roles:** client.
      operationId: createAppointment
      x-status: planned
      x-owner: unassigned
      x-jira: SYS-28
      x-roles: [client]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
