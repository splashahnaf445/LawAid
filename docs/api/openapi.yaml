    # ---------------- lawyer registration & verification (implemented shapes) ----------------
    LawyerRegisterRequest:
      type: object
      description: |
        Multipart form. Field names are exactly those of the implemented serializer.
        `specialization` is a free-text field in the current code; the database schema
        models it as practice areas (`lawyer_practice_areas`), see README.
      required: [full_name, email, password, bar_council_no, nid_document, bar_certificate_document]
      properties:
        full_name:
          type: string
          maxLength: 255
          example: Farhan Chowdhury
        email:
          type: string
          format: email
          example: farhan.chowdhury@example.com
        phone:
          type: string
          description: Optional. `01XXXXXXXXX` or `+8801XXXXXXXXX`; stored as `+8801XXXXXXXXX`; must be unique.
          example: '+8801712000016'
        password:
          type: string
          format: password
          minLength: 6
          writeOnly: true
          example: LawAid@123
        honorific:
          type: string
          maxLength: 20
          default: Adv.
          example: Adv.
        headline:
          type: string
          maxLength: 255
          default: Advocate, High Court Division
          example: Advocate
        bar_council_no:
          type: string
          maxLength: 50
          pattern: '^[A-Za-z0-9\-/]{3,30}$'
          description: Sanad / Bar ID. Trimmed, upper-cased, unique.
          example: DH-22871
        bar_association:
          type: string
          maxLength: 150
          default: Dhaka Bar Association
          example: Dhaka Bar Association
        chamber_address:
          type: string
          default: ''
          example: Nayabazar, Dhaka
        district:
          type: string
          maxLength: 100
          default: Dhaka
          example: Dhaka
        specialization:
          type: string
          maxLength: 255
          default: Civil Litigation, Property Law
          example: Criminal Defense
        consultation_fee:
          type: string
          format: decimal
          default: '1000.00'
          example: '600.00'
        years_experience:
          type: integer
          minimum: 0
          default: 1
          example: 4
        bio:
          type: string
          default: ''
          example: ''
        nid_document:
          type: string
          format: binary
          description: NID scan (both sides). PDF, PNG, JPG or JPEG, at most 15 MB.
        bar_certificate_document:
          type: string
          format: binary
          description: Bar Council enrolment certificate. PDF, PNG, JPG or JPEG, at most 15 MB.
    VerificationDocumentsUpload:
      type: object
      required: [nid_document, bar_certificate_document]
      properties:
        nid_document:
          type: string
          format: binary
          description: PDF, PNG, JPG or JPEG, at most 15 MB.
        bar_certificate_document:
          type: string
          format: binary
          description: PDF, PNG, JPG or JPEG, at most 15 MB.
