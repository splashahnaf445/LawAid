version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: lawaid_db
    restart: always
    environment:
      POSTGRES_DB: lawaid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lawaid_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lawaid"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawaid_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - encrypted_docs:/app/storage/encrypted_documents
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-lawaid-dev-key-2026
      - DATABASE_URL=postgres://postgres:lawaid_password@db:5432/lawaid
      - DOCUMENT_ENCRYPTION_KEY=c1nwgexw36iltaDC_aCA64MHK2AkBmvxoJK0YdQ4GZY=
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawaid_frontend
    restart: always
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  encrypted_docs:
